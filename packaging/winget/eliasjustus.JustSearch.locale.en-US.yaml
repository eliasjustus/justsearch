License: Apache-2.0
LicenseUrl: https://github.com/justsearch-app/justsearch/blob/main/LICENSE
ShortDescription: A local-first hybrid search engine and cited on-device AI assistant for your files.
Description: >-
  JustSearch indexes local documents (PDF, email, Office, and most common document formats) and
  answers questions over them with cited passages, without anything leaving your machine. It
  combines BM25 keyword search, dense-vector embeddings, and SPLADE learned-sparse retrieval with
  a cross-encoder reranker, and exposes that retrieval over the Model Context Protocol (MCP) so
  any AI agent -- local or cloud -- can use it as a private retrieval backend.
Moniker: justsearch
Tags:
  - search
  - local-first
  - rag
  - mcp
  - offline
  - retrieval
