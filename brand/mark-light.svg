<!--
  JustSearch mark "The Slot" - master, light-ground colorway (ink #16181c, accent #00655B).

  The 64-unit viewBox IS the artboard. The composition sits x 6 -> 62 deliberately off-centre:
  the sealed mass is the subject, the answer-line stands OUTSIDE it. Never re-centre, trim or
  re-pad this viewBox - doing so destroys the "outside" reading the mark is built on.

  Use at >= 48px (footnote included). 25-47px: same file, drop #footnote. <= 24px: mark-small-*.svg.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="JustSearch">
  <path id="mass" fill="#16181c"
        d="M10,8 H38 A4,4 0 0 1 42,12 V28 H24 V36 H42 V52 A4,4 0 0 1 38,56 H10 A4,4 0 0 1 6,52 V12 A4,4 0 0 1 10,8 Z"/>
  <rect id="answer-line" x="46" y="28" width="14" height="8" fill="#00655B"/>
  <rect id="footnote" x="58" y="22" width="4" height="4" fill="#00655B"/>
</svg>
