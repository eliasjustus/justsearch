<!--
  JustSearch mark - dedicated <= 24px cut, dark-ground colorway. 16-unit grid.

  Pixel-exact at 16px and 32px. At 24px the 1.5x scale puts every odd coordinate on a half-pixel,
  so the .ico's 24px frame is authored separately as mark-24-dark.svg (hand-snapped) rather than
  rendered from this file.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16"
     shape-rendering="crispEdges" role="img" aria-label="JustSearch">
  <path id="mass" fill="#eceef1" d="M1,2 H10 V6 H5 V10 H10 V14 H1 Z"/>
  <rect id="answer-line" x="11" y="6" width="4" height="4" fill="#00CCB2"/>
</svg>
