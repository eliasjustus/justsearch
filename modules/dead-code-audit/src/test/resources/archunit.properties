# ArchUnit configuration for the whole-program dead-class rule (tempdoc 930 chunk F).
#
# WholeProgramDeadCodeTest wraps its rule in FreezingArchRule. The violation store under
# `modules/dead-code-audit/archunit_store/` (committed) replaces the retired `dead-code-jvm`
# kernel gate and its `gates/dead-code-jvm/baseline.txt`: the store IS the accepted set of
# whole-program-dead classes. A class that becomes dead and is not in the store fails the build;
# a stored class that stops being dead is dropped from the store on the next run (the ratchet
# shrinks, which is what the gate's `--rebalance` used to do).
#
# The store path is also passed as an absolute path from build.gradle.kts
# (`archunit.freeze.store.default.path`), because ArchUnit resolves a relative store path against
# the JVM working directory and system properties prefixed `archunit.` override this file.
freeze.store.default.path=archunit_store

# The store is committed, so creating one is never correct in a normal run: a missing store means
# the path is wrong or the checkout is incomplete, and silently creating an empty one would freeze
# every current violation as accepted (a vacuous green). Flip to `true` for exactly one local run
# when deliberately re-seeding the store from scratch, then flip it back in the same commit.
freeze.store.default.allowStoreCreation=false

# Left at the default (true) on purpose: it is the ratchet's shrink direction. Removing a dead
# class and re-running drops it from the store; growth still fails.
freeze.store.default.allowStoreUpdate=true
