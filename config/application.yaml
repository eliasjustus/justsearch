app:
  package_base: io.justsearch
  # data_dir: Resolved automatically via PlatformPaths (platform-specific defaults).
  #   - Windows: %LOCALAPPDATA%\JustSearch
  #   - macOS: ~/Library/Application Support/JustSearch  
  #   - Linux: ~/.justsearch
  # Override with: JUSTSEARCH_DATA_DIR env var or -Djustsearch.data.dir system property
  timezone: Europe/Berlin

llm:
  enabled: true
  # model_path: override via JUSTSEARCH_LLM_MODEL_PATH if needed (defaults resolved from models dir)

workers:
  ai:
    enabled: true
    host: 127.0.0.1
    port: 50061
    deadlineMs: 1500
    features:
      embed: true
      classify: true

telemetry:
  metrics:
    flush_ms: 15000
    retention:
      days: 7
  pipeline:
    stage_metrics:
      enabled: true
  capabilities:
    refresh_interval_ms: 60000

plugins:
  pipeline:
    enabled: true
    egress:
      default_policy: deny

infra:
  health:
    poll_interval_ms: 5000
    thresholds:
      nrt_stale_ms: 30000
      translator_handshake_stale_ms: 120000
      ann_cache_ready_percent: 75
    grpc:
      host: 127.0.0.1
      port: 7443

search:
  pipeline:
    profile: desktop-default
  rerank:
    enabled: false
    k: 50
  facets:
    enabled: true
    fields:
      - mime
      - language
  corrections:
    enabled: true
    df_threshold: 5
    max_edit_distance: 1
    zero_hit_retry_enabled: true
  hybrid:
    bm25_k: 200
    ann_k: 200
    auto_embed: true

index:
  auto_recovery: true  # Automatically delete corrupted index and rebuild (data loss on recovery)
  language_detection:
    enabled: true
  commit:
    policy: per_batch
    debounce_ms: 0
  pipeline:
    profile: desktop-default
  soft_deletes:
    field: "_soft_delete"
    retention:
      enabled: true
      days: 7
      # max_versions: 3
  watcher:
    overflow:
      rescan_on_overflow: true
  ocr:
    enabled: true
    languages: []
    trigger:
      min_image_pixels: 524288
    limits:
      # Aggregate per-document OCR budget (must sit below the outer extractor timebox).
      per_file_timeout_ms: 30000
      # 200 = sanity ceiling only; the per-document budget above is the cost bound (706).
      max_pages: 200
      max_image_dimension: 4096
      # max_image_pixels: 50000000
      render_dpi: 300
    # 0 = auto (min(cores/2, 8))
    workers: 0
  export:
    otlp:
      # Dormant since inception — no collector exists in this repo; aspirational
      # config, see tempdoc 742.
      traces:
        enabled: false
        endpoint: http://collector:4317
        tls:
          insecure: true
      metrics:
        enabled: false
        endpoint: http://collector:4318/v1/metrics
      # Dormant since inception — no collector exists in this repo; aspirational
      # config, see tempdoc 742.
      logs:
        enabled: false
        endpoint: http://collector:4317
