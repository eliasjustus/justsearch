# CLA Assistant records one-time Contributor License Agreement signatures on
# pull requests. See CLA.md for the agreement and CONTRIBUTING.md for the
# contributor policy.
#
# The public repo keeps CLA canonical. CLA signatures are stored on the
# cla-signatures branch at signatures/version1/cla.json. The workflow passes
# with the repository token today; PERSONAL_ACCESS_TOKEN remains accepted as a
# compatibility path for deployments that need a separate write token.
name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]
  # Merge-queue readiness (tempdoc 829 R4). `cla-assistant` is a required status
  # check, so it must also report on a queued merge group or the group waits for a
  # check that never arrives and the queue times it out. contributor-assistant runs
  # off pull-request context (`github.event.pull_request`, or an issue comment on a
  # PR), which a merge_group event does not carry — so the queue run reports the
  # no-op pass below instead. Inert until the repo is organization-owned and a queue
  # is configured: no merge_group event can be delivered before then.
  merge_group:
    types: [checks_requested]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  # The job id is the required-check context name (`cla-assistant`) — do not rename
  # it, and do not split the merge-queue pass into a second job: a job id is unique
  # per workflow, so the two variants are two mutually exclusive steps of this one
  # job. Exactly one of them runs per event.
  cla-assistant:
    runs-on: ubuntu-latest
    steps:
      # merge_group only: signature enforcement already ran on the pull request, and
      # contributor-assistant has no pull-request context to act on here. Reporting a
      # pass is what keeps the queue moving. Skipped on every other event, so the
      # pull_request_target / issue_comment behaviour below is unchanged.
      - name: CLA enforced on the pull request (merge queue no-op)
        if: github.event_name == 'merge_group'
        run: echo "CLA signatures are enforced on the pull request itself; nothing to re-check for a queued merge group."

      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://github.com/eliasjustus/justsearch/blob/main/CLA.md'
          branch: 'cla-signatures'
          # Maintainer and bots never need to sign.
          allowlist: 'eliasjustus,dependabot[bot]'
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-notsigned-prcomment: 'Thank you for your pull request! Before we can merge it, please read our [Contributor License Agreement](https://github.com/eliasjustus/justsearch/blob/main/CLA.md) (you keep your copyright; it just keeps the project''s licensing options open) and sign it by posting exactly the comment below.'
          custom-allsigned-prcomment: 'All contributors have signed the CLA.'
