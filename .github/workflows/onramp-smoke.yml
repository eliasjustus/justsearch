# Tempdoc 656 — the onramp's continuous proof-lane.
#
# Runs the runnable first-success proof (scripts/dev/test-onramp-first-success.mjs) on a clean
# public-hosted runner with NO models and NO GPU, so it exercises the model-less **Tier 0** path:
# start the stack -> index the bundled demo corpus -> a keyword query returns a real result.
# This continuously proves the onramp's headline promise (zero-download first success) still works.
#
# Manual (workflow_dispatch) + advisory/non-blocking, matching the repo's "specialty workflows remain
# manual; local-first primary" policy (ADR-0044 / CLAUDE.md). Declared in
# scripts/ci/workflow-signal-policy.v1.json as class "scheduled-quality-signal".
name: Onramp Smoke

on:
  workflow_dispatch: # Manual trigger — heavy (starts the full dev stack); not a per-PR gate.

permissions:
  contents: read

env:
  NODE_VERSION: "24.14.0"
  JAVA_VERSION: "25"


jobs:
  update-preserves-models-probe:
    name: TEMPORARY probe of the update-preserves-models lane
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download base (N) installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Path base -Force | Out-Null
          gh release download 'v0.1.0' --repo $env:GITHUB_REPOSITORY --pattern '*_x64-setup.exe' --dir base
          if ($LASTEXITCODE -ne 0) { throw "Failed to download the base installer." }
          Get-ChildItem base | Format-Table Name, Length

      - name: Download candidate (N+1) installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Path candidate -Force | Out-Null
          gh release download 'v0.2.0' --repo $env:GITHUB_REPOSITORY --pattern '*_x64-setup.exe' --dir candidate
          if ($LASTEXITCODE -ne 0) { throw "Failed to download the candidate installer." }
          Get-ChildItem candidate -Recurse -File | Format-Table FullName, Length

      - name: Resolve installers and assert a real version increase
        id: resolve
        shell: pwsh
        run: |
          function Resolve-Setup {
            param([string]$Dir, [string]$Label)
            $exe = Get-ChildItem -Path $Dir -Recurse -File -Filter '*_x64-setup.exe' |
              Sort-Object Length -Descending | Select-Object -First 1
            if (-not $exe) { throw "No *_x64-setup.exe found for $Label under $Dir." }
            if ($exe.Name -notmatch '_(?<v>[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.\-]+)?)_x64-setup\.exe$') {
              throw "Cannot parse a version out of the $Label installer name '$($exe.Name)'."
            }
            return [pscustomobject]@{ Path = $exe.FullName; Version = $Matches['v'] }
          }
          $base = Resolve-Setup -Dir 'base' -Label 'base (N)'
          $cand = Resolve-Setup -Dir 'candidate' -Label 'candidate (N+1)'
          Write-Host "Base      : $($base.Version)  $($base.Path)"
          Write-Host "Candidate : $($cand.Version)  $($cand.Path)"
          if ($base.Version -eq $cand.Version) { throw "Base and candidate are the same version." }
          $baseCore = [version](($base.Version -split '-')[0])
          $candCore = [version](($cand.Version -split '-')[0])
          if ($candCore -lt $baseCore) { throw "Candidate is older than base; allowDowngrades=false." }
          "basePath=$($base.Path)"       >> $env:GITHUB_OUTPUT
          "baseVersion=$($base.Version)" >> $env:GITHUB_OUTPUT
          "candPath=$($cand.Path)"       >> $env:GITHUB_OUTPUT
          "candVersion=$($cand.Version)" >> $env:GITHUB_OUTPUT

      - name: Install N, seed models, upgrade to N+1, uninstall, assert survival
        shell: pwsh
        run: |
          ./scripts/release/update-preserves-models-test.ps1 `
            -BaseInstaller '${{ steps.resolve.outputs.basePath }}' `
            -CandidateInstaller '${{ steps.resolve.outputs.candPath }}' `
            -BaseVersion '${{ steps.resolve.outputs.baseVersion }}' `
            -CandidateVersion '${{ steps.resolve.outputs.candVersion }}' `
            -OutFile "$env:GITHUB_WORKSPACE/evidence/update-preserves-models.v1.json"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: update-preserves-models-evidence
          path: evidence/update-preserves-models.v1.json
          if-no-files-found: warn
          retention-days: 90
